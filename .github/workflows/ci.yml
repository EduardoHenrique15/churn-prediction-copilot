name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format --check)
        run: ruff format --check .

      - name: Testes com cobertura
        # Sem GEMINI_API_KEY e sem os testes marcados como integration (ver
        # pyproject.toml): nenhuma chamada ao Gemini sai do CI.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  imagem-api:
    name: Imagem Docker da API
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t churn-radar-api .

      - name: Sobe o container e testa /health e /predict
        run: |
          docker run -d --name api -p 8000:8000 churn-radar-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No","tenure":5,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":85.5,"TotalCharges":450.75}'

      - name: Tamanho da imagem e memória em uso (limite do Render free = 512 MB)
        run: |
          docker image ls churn-radar-api --format 'Imagem: {{.Size}}'
          docker stats --no-stream --format 'Memória do container: {{.MemUsage}}' api
  imagem-interface:
    name: Imagem Docker da interface
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      # Builda a partir de um clone limpo, como o docker compose de quem
      # clona o repositório: pega arquivo que só existe na máquina de quem
      # desenvolve (foi assim que o COPY chroma_db/ passou despercebido).
      - name: Build
        run: docker build -f Dockerfile.streamlit -t churn-radar-app .

      - name: Sobe o container e testa o healthcheck do Streamlit
        run: |
          docker run -d --name app -p 8501:8501 churn-radar-app
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8501/_stcore/health && exit 0; sleep 1; done
          docker logs app
          exit 1
