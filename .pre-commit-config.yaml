# Instale uma vez com `pre-commit install`: os hooks rodam a cada commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(notebooks/|chroma_db/)
      - id: trailing-whitespace
        exclude: ^(notebooks/|chroma_db/)
      - id: check-added-large-files
        args: [--maxkb=1500]
        exclude: ^docs/screenshots/demo\.gif$
      - id: detect-private-key
